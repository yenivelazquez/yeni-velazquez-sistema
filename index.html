async function doSetAppointmentStatus(id, status){
  const appt = appointmentRepository.getById(id);
  if(!appt) return;
  const c = clientRepository.getById(appt.clientId);
  const patch = { status };
  let treatmentLogged = false;

  // Si la clienta vino de verdad, se carga sola el tratamiento en su historial
  // (una sola vez — si se corrige el estado varias veces no se duplica).
  if(status==='done' && !appt.linkedTreatmentId && c){
    const treatmentId = uid();
    const snap = catalogSnapshotFor(appt.treatment);
    const treatments = [...(c.treatments||[]), {
      id: treatmentId, name: appt.treatment || 'Tratamiento sin especificar', date: appt.date,
      sucursal: appt.sucursal, professional: appt.professional || null, notes: appt.notes || null,
      nextVisitSuggested: null, fromAppointmentId: appt.id, price: snap.price, cost: snap.cost,
    }];
    await clientRepository.update(c.id, { treatments, points: (c.points||0) + 50 });
    patch.linkedTreatmentId = treatmentId;
    treatmentLogged = true;
  }

  await appointmentRepository.update(id, patch);
  await auditRepository.log('appointment.status', {entity:'appointments', entityId:id, description:`Turno de ${c?c.name:''} marcado como "${APPT_STATUS_LABELS[status]}"`, branch:appt.sucursal});
  setState({turnosMenuId:null});
  showToast(`Turno marcado como ${APPT_STATUS_LABELS[status].toLowerCase()}${treatmentLogged ? ' — se cargó el tratamiento en su historial' : ''}`);
}

// Actualiza el nombre de la sucursal en todos los lugares donde ya está cargada
// (clientas, tratamientos, staff, turnos, gastos, diagnósticos) — a diferencia
// de otros "eliminar" del sistema, acá sí conviene mantener todo consistente.
function cascadeRenameBranch(oldName, newName){
  Object.values(DB.clients).forEach(c => {
    if(c.sucursal===oldName) c.sucursal = newName;
    (c.treatments||[]).forEach(t => { if(t.sucursal===oldName) t.sucursal = newName; });
  });
  Object.values(DB.staff).forEach(s => { if(s.branch===oldName) s.branch = newName; });
  Object.values(DB.appointments).forEach(a => { if(a.sucursal===oldName) a.sucursal = newName; });
  Object.values(DB.expenses).forEach(e => { if(e.sucursal===oldName) e.sucursal = newName; });
  Object.values(DB.diagnoses).forEach(d => { if(d.sucursal===oldName) d.sucursal = newName; });
  if(state.branchFilter===oldName) state.branchFilter = newName;
}

async function doRenameBranch(oldName){
  if(!hasPermission(PERMISSIONS.SETTINGS_MANAGE)) return;
  const newName = document.getElementById('rb_name').value.trim();
  if(!newName){ state.errors.branch = 'Ponele un nombre a la sucursal.'; render(); return; }
  if(newName !== oldName && getBranches().includes(newName)){ state.errors.branch = 'Ya existe una sucursal con ese nombre.'; render(); return; }
  const branches = getBranches().map(b => b===oldName ? newName : b);
  cascadeRenameBranch(oldName, newName);
  await settingsRepository.update({ branches });
  await auditRepository.log('settings.branch_rename', {entity:'settings', description:`Sucursal "${oldName}" renombrada a "${newName}"`});
  state.errors.branch = null;

}

// Heurística simple para armar el link de WhatsApp a partir del teléfono
// guardado (pensado para números argentinos: agrega 549 si no está ya).
function buildWhatsAppLink(phone, message){
  let digits = (phone||'').replace(/\D/g,'');
  if(!digits.startsWith('54')) digits = '549' + digits;
  return `https://wa.me/${digits}?text=${encodeURIComponent(message)}`;
}

    navigator.share({text}).catch(()=>{});
  }else{
    navigator.clipboard.writeText(text).then(()=> showToast('Copiado al portapapeles'));
  }
}

function doCopyCode(code){
  navigator.clipboard.writeText(code).then(()=> showToast('Código copiado')).catch(()=> showToast('No pudimos copiar el código'));
}

function doViewTreatmentDetails(id){
  const c = clientRepository.getById(state.clientSession.clientId);
  if(!c) return;
  const t = (c.treatments||[]).find(x=>x.id===id);
  if(!t) return;
  showToast(`${t.name} · ${fmtDate(t.date)} · ${t.sucursal||'—'}`);
}

/* =========================================================
   INIT
   ========================================================= */
let _lastActivityAt = Date.now();
['click','keydown','touchstart'].forEach(evt => {
  document.addEventListener(evt, () => { _lastActivityAt = Date.now(); }, {passive:true});
});
setInterval(() => {
  const timeoutMs = (APP_CONFIG.security.inactivityTimeoutMinutes||60) * 60000;
  if(Date.now() - _lastActivityAt > timeoutMs){
    let expired = false;
    if(state.staffSession){ state.staffSession = null; expired = true; }
    if(state.clientSession){ state.clientSession = null; expired = true; }
    if(expired){ _lastActivityAt = Date.now(); showToast('Tu sesión expiró por inactividad.'); }
  }
}, 30000);

window.addEventListener('hashchange', () => render());
setInterval(() => { checkOverdueAppointments(); }, 60000);
setInterval(() => {
  if(state.clientSession && state.clientView==='inicio'){
    const activeBanners = bannerRepository.getActive();
    if(activeBanners.length > 1 && !state.modal){
      state.bannerIndex = state.bannerIndex + 1;
      render();
    }
  }
}, 5000);

(async function init(){
  document.getElementById('app').innerHTML = `<div class="center-screen"><p style="color:var(--text-secondary);">Cargando…</p></div>`;
  await loadDB();
  await checkOverdueAppointments();
  if(!window.location.hash) window.location.hash = '#/portal';
  render();
})();
</script>
